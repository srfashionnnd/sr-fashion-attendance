<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Fashion — Staff</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo-cropped.jpeg" class="logo-img" alt="SR Fashion">
        <div class="brand-text">
          <span class="title">SR Fashion</span>
          <span class="sub">NANDED</span>
        </div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="staff.html" class="nav-link active">Staff</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="settings.html" class="nav-link">Settings</a>
        <a href="idcard.html" class="nav-link">ID Cards</a>
        <a href="kiosk.html" class="nav-link">Kiosk Screen</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Staff</h1>
          <p class="page-subtitle" id="staffCountNote"></p>
        </div>
        <button class="btn btn-primary" id="btnAddStaff">+ Add Staff</button>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by name, employee ID, barcode, or mobile…">
      </div>

      <div class="panel glass">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Designation</th><th>Department</th>
              <th>Mobile</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="staffTableBody"></tbody>
        </table>
        <p class="empty-note" id="staffEmptyNote" style="display:none;">No staff found.</p>
      </div>
    </main>
  </div>

  <!-- ---------------- Add / Edit Staff Modal ---------------- -->
  <div class="modal-backdrop" id="staffModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle" style="font-size:20px;">Add Staff</h2>
        <button class="modal-close" id="btnCloseModal">&times;</button>
      </div>

      <form id="staffForm">
        <input type="hidden" id="fEmployeeId">

        <div class="field">
          <label>Full Name *</label>
          <input type="text" id="fName" required>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Designation</label>
            <input type="text" id="fDesignation">
          </div>
          <div class="field">
            <label>Department</label>
            <input type="text" id="fDepartment">
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Mobile Number</label>
            <input type="tel" id="fMobile">
          </div>
          <div class="field">
            <label>Joining Date</label>
            <input type="date" id="fJoiningDate">
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Blood Group</label>
            <select id="fBloodGroup">
              <option value="">—</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>O+</option><option>O-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
          <div class="field">
            <label>Emergency Contact</label>
            <input type="tel" id="fEmergencyContact">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btnCancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSaveStaff">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/staff.js"></script>
</body>
</html>
