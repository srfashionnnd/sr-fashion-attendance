<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Fashion — Settings</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="stylesheet" href="assets/css/settings.css">
</head>
<body>

  <div class="shell">
    <div class="mobile-topbar">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu"><span></span></button>
      <img src="assets/images/logo-cropped.jpeg" class="logo-img" alt="SR Fashion">
      <span class="brand-text">SR Fashion</span>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo-cropped.jpeg" class="logo-img" alt="SR Fashion">
        <div class="brand-text">
          <span class="title">SR Fashion</span>
          <span class="sub">NANDED</span>
        </div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="staff.html" class="nav-link">Staff</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="settings.html" class="nav-link active">Settings</a>
        <a href="idcard.html" class="nav-link">ID Cards</a>
        <a href="kiosk.html" class="nav-link">Kiosk Screen</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">Log Out</button>
      </div>
    </aside>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Settings</h1>
          <p class="page-subtitle">Shift timing, weekly off, holidays, and admin password</p>
        </div>
      </div>

      <!-- ---------------- Company & Shift Settings ---------------- -->
      <div class="panel glass">
        <div class="panel-title"><span>Company &amp; Shift</span></div>

        <form id="settingsForm">
          <div class="form-grid">
            <div class="field">
              <label>Company Name</label>
              <input type="text" id="sCompanyName">
            </div>
            <div class="field">
              <label>Weekly Off Day</label>
              <select id="sWeeklyOffDay">
                <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
              </select>
            </div>
          </div>

          <div class="form-grid">
            <div class="field">
              <label>Shift Start (24h)</label>
              <input type="time" id="sShiftStart">
            </div>
            <div class="field">
              <label>Shift End (24h)</label>
              <input type="time" id="sShiftEnd">
            </div>
          </div>

          <div class="field" style="max-width:240px;">
            <label>Grace Period (minutes)</label>
            <input type="number" id="sGraceMinutes" min="0" max="120">
          </div>

          <div class="modal-actions" style="justify-content:flex-start;">
            <button type="submit" class="btn btn-primary" id="btnSaveSettings">Save Settings</button>
          </div>
        </form>
      </div>

      <!-- ---------------- Change Admin Password ---------------- -->
      <div class="panel glass">
        <div class="panel-title"><span>Change Admin Password</span></div>

        <form id="passwordForm">
          <div class="form-grid">
            <div class="field">
              <label>Current Password</label>
              <input type="password" id="pOldPassword" required>
            </div>
            <div class="field">
              <label>New Password</label>
              <input type="password" id="pNewPassword" required minlength="4">
            </div>
          </div>
          <div class="modal-actions" style="justify-content:flex-start;">
            <button type="submit" class="btn btn-primary" id="btnChangePassword">Update Password</button>
          </div>
        </form>
      </div>

      <!-- ---------------- Holiday Management ---------------- -->
      <div class="panel glass">
        <div class="panel-title">
          <span>Holidays</span>
          <button class="btn btn-primary btn-small" id="btnAddHoliday">+ Add Holiday</button>
        </div>

        <table>
          <thead><tr><th>Date</th><th>Name</th><th>Type</th><th></th></tr></thead>
          <tbody id="holidayTableBody"></tbody>
        </table>
        <p class="empty-note" id="holidayEmptyNote" style="display:none;">No holidays added yet.</p>
      </div>
    </main>
  </div>

  <!-- ---------------- Add Holiday Modal ---------------- -->
  <div class="modal-backdrop" id="holidayModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 style="font-size:20px;">Add Holiday</h2>
        <button class="modal-close" id="btnCloseHolidayModal">&times;</button>
      </div>

      <form id="holidayForm">
        <div class="field">
          <label>Date</label>
          <input type="date" id="hDate" required>
        </div>
        <div class="field">
          <label>Holiday Name</label>
          <input type="text" id="hName" required>
        </div>
        <div class="field">
          <label>Type</label>
          <select id="hType">
            <option>Public</option>
            <option>Festival</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btnCancelHoliday">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/settings.js"></script>
</body>
</html>
